repos:
  - repo: local
    hooks:
      - id: ruff-check-plugins
        name: ruff-check (plugins)
        entry: ruff check --force-exclude --config ruff-plugins.toml
        language: python
        additional_dependencies: [ruff==0.15.9]
        types_or: [python, pyi, jupyter]
        exclude: ^plugins/(modules|module_utils)/
      - id: ruff-format-plugins
        name: ruff-format (plugins)
        entry: ruff format --force-exclude --config ruff-plugins.toml
        language: python
        additional_dependencies: [ruff==0.15.9]
        types_or: [python, pyi, jupyter]
        exclude: ^plugins/(modules|module_utils)/
      - id: ruff-check-modules
        name: ruff-check (modules)
        entry: ruff check --force-exclude --config ruff-modules.toml
        language: python
        additional_dependencies: [ruff==0.15.9]
        types_or: [python, pyi, jupyter]
        files: ^plugins/(modules|module_utils)/
      - id: ruff-format-modules
        name: ruff-format (modules)
        entry: ruff format --force-exclude --config ruff-modules.toml
        language: python
        additional_dependencies: [ruff==0.15.9]
        types_or: [python, pyi, jupyter]
        files: ^plugins/(modules|module_utils)/
