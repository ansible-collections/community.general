---
ancestor: 13.0.0
releases:
  14.0.0:
    changes:
      breaking_changes:
        - pfexec become plugin - the default for ``wrap_exe`` changed from ``false``
          to ``true`` (https://github.com/ansible-collections/community.general/pull/12891).
      bugfixes:
        - aix_devices - fix ``chdev`` command failures being incorrectly reported
          as successful results, now properly fails the task when device attribute
          changes cannot be applied (https://github.com/ansible-collections/community.general/pull/12185).
        - apache2_module - determine ``changed`` from the output of ``a2enmod``/``a2dismod``
          when ``ignore_configcheck=true`` and the Apache configuration check fails
          (https://github.com/ansible-collections/community.general/issues/3510, https://github.com/ansible-collections/community.general/pull/13147).
        - apache2_module - fix ``state=absent`` doing nothing when ``ignore_configcheck=true``
          and the Apache configuration check fails (https://github.com/ansible-collections/community.general/issues/3510,
          https://github.com/ansible-collections/community.general/pull/13147).
        - apache2_module - fix false failures when ``ignore_configcheck`` is set and
          the configuration is broken for a reason unrelated to the module being changed
          (https://github.com/ansible-collections/community.general/issues/4592, https://github.com/ansible-collections/community.general/pull/12597).
        - apk - fail cleanly when the ``world`` file cannot be read (https://github.com/ansible-collections/community.general/issues/10739,
          https://github.com/ansible-collections/community.general/pull/13179).
        - apk - the ``upgrade`` operation no longer reports ``changed=true`` when
          nothing was upgraded but an apk commit hook (for example ``mrtest``, or
          anything installed in ``/etc/apk/commit_hooks.d/``) printed output before
          the trailing ``OK:`` summary line; the change status is now derived from
          the packages apk actually reports upgrading (https://github.com/ansible-collections/community.general/issues/12223,
          https://github.com/ansible-collections/community.general/pull/12376).
        - bitwarden lookup plugin - mark the ``bw_session`` option as sensitive so
          that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - bitwarden_secrets_manager lookup plugin - mark the ``bws_access_token``
          option as sensitive so that ansible-core 2.22+ will automatically redact
          its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - capabilities - fix idempotency when the installed ``libcap`` normalizes
          capability operators or flags, or when multiple capabilities are set at
          once (https://github.com/ansible-collections/community.general/issues/4067,
          https://github.com/ansible-collections/community.general/pull/12650).
        - cloudflare_dns - fix detection of existing CAA, SRV, and TLSA records (https://github.com/ansible-collections/community.general/issues/7766,
          https://github.com/ansible-collections/community.general/issues/7780, https://github.com/ansible-collections/community.general/pull/13170).
        - cloudflare_dns - fix failure when looking up records whose value contains
          a comma (https://github.com/ansible-collections/community.general/issues/10208,
          https://github.com/ansible-collections/community.general/pull/13119).
        - cobbler inventory plugin - do not use TLS when connecting to ``http://``
          URLs (https://github.com/ansible-collections/community.general/issues/11246,
          https://github.com/ansible-collections/community.general/pull/12847).
        - cobbler inventory plugin - fix crash about a missing ``_cache`` attribute
          when inventory caching is disabled (https://github.com/ansible-collections/community.general/pull/12848).
        - cobbler inventory plugin - mark the ``password`` option as sensitive so
          that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - composer - fix ``apcu_autoloader`` never passing ``--apcu-autoloader`` to
          composer, because the option was mapped to the misspelled ``acpu-autoloader``
          (https://github.com/ansible-collections/community.general/pull/12988).
        - composer - pass ``--apcu`` for ``apcu_autoloader`` to ``dump-autoload``,
          which has no ``--apcu-autoloader`` flag (https://github.com/ansible-collections/community.general/pull/12989).
        - composer - restore compatibility with older compose versions when using
          ``working_dir`` (https://github.com/ansible-collections/community.general/issues/12293,
          https://github.com/ansible-collections/community.general/pull/12339).
        - composer - the ``--working-dir`` option is now always placed first on the
          command line, before the subcommand, to ensure consistent behavior across
          all composer commands (https://github.com/ansible-collections/community.general/issues/5204,
          https://github.com/ansible-collections/community.general/pull/12084).
        - composer - use file checksum to determine ``changed`` status when ``command=config``,
          instead of relying on the command return output. The module now compares
          SHA256 checksums of relevant configuration files (``composer.json``, ``auth.json``,
          or their global equivalents) before and after running the command (https://github.com/ansible-collections/community.general/pull/12084).
        - consul_kv lookup plugin - mark the ``token`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - counter_enabled callback - fix missing output for looped tasks, including
          tasks using ``delegate_to`` (https://github.com/ansible-collections/community.general/issues/8187,
          https://github.com/ansible-collections/community.general/pull/12067).
        - credstash lookup plugin - mark the ``aws_secret_access_key`` and ``aws_session_token``
          options as sensitive so that ansible-core 2.22+ will automatically redact
          its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - diy callback plugin - no longer emits deprecation warnings about ``v2_on_any``
          and ``convert_data`` with ansible-core 2.19 and later (https://github.com/ansible-collections/community.general/issues/10545,
          https://github.com/ansible-collections/community.general/pull/13093).
        - django_createcachetable - do not pass the unsupported ``--noinput`` option
          to ``django-admin createcachetable`` (https://github.com/ansible-collections/community.general/pull/13002).
        - dnf_config_manager - fix incompatibility with DNF5. The module was crashing
          on systems with DNF5 due to CLI changes since DNF4 (https://github.com/ansible-collections/community.general/issues/9127,
          https://github.com/ansible-collections/community.general/pull/12206).
        - doas become plugin - mark the ``become_pass`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - dsv lookup plugin - mark the ``client_secret`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - dzdo become plugin - mark the ``become_pass`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - elastic callback plugin - mark the ``apm_secret_token`` and ``apm_api_key``
          options as sensitive so that ansible-core 2.22+ will automatically redact
          its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - etcd3 lookup plugin - mark the ``password`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - filesystem - handle BusyBox ``blkid`` output to correctly detect existing
          filesystems on systems like Alpine Linux (https://github.com/ansible-collections/community.general/issues/7283,
          https://github.com/ansible-collections/community.general/pull/12235).
        - filesystem - the module now also handles the output format of bcachefs-tools
          v1.38.4 and above (https://github.com/ansible-collections/community.general/issues/12259,
          https://github.com/ansible-collections/community.general/pull/12291).
        - filetree lookup plugin - raise ``AnsibleLookupError`` when the ``exclude``
          option contains an invalid regular expression instead of an uncaught ``re.error``
          (https://github.com/ansible-collections/community.general/pull/12140).
        - git_config and git_config_info - allow empty string values and preserve
          idempotency (https://github.com/ansible-collections/community.general/issues/12502,
          https://github.com/ansible-collections/community.general/pull/12708).
        - github_app_access_token lookup plugin - mark the ``private_key`` option
          as sensitive so that ansible-core 2.22+ will automatically redact its values
          in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - github_app_access_token lookup plugin - mark the return value as a secret
          on ansible-core 2.22+ (https://github.com/ansible-collections/community.general/pull/12884).
        - github_deploy_key - do not delete an existing deploy key when running with
          ``state=absent`` in check mode (https://github.com/ansible-collections/community.general/issues/12348,
          https://github.com/ansible-collections/community.general/pull/13132).
        - gitlab_instance_variable - ignore the ``hidden`` attribute that GitLab 19.1
          and newer return for instance variables when comparing them with the requested
          variables. Before, ``purge=true`` deleted every instance variable, including
          the ones the task had just created, and every run reported a change (https://github.com/ansible-collections/community.general/issues/12349,
          https://github.com/ansible-collections/community.general/pull/13029).
        - gitlab_project - fix ``'bool' object has no attribute 'attributes'`` (https://github.com/ansible-collections/community.general/issues/12902,
          https://github.com/ansible-collections/community.general/pull/12903).
        - gitlab_project - return ``project`` in the result when running in check
          mode (https://github.com/ansible-collections/community.general/pull/12689,
          https://github.com/ansible-collections/community.general/issues/5689).
        - gitlab_runner - do not fail with ``'<' not supported between instances of
          'str' and 'int'`` when python-gitlab cannot read the GitLab server version.
          The module now assumes that the server is new enough and emits a warning
          (https://github.com/ansible-collections/community.general/issues/12707,
          https://github.com/ansible-collections/community.general/pull/12899).
        - gitlab_runners inventory plugin - mark the ``api_token`` option as sensitive
          so that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - gitlab_user - fix lookup of existing users whose username contains uppercase
          letters (https://github.com/ansible-collections/community.general/issues/5999,
          https://github.com/ansible-collections/community.general/pull/13064).
        - haproxy - fix ``state=disabled`` with ``drain=true`` timing out instead
          of putting a server that is already down into maintenance mode (https://github.com/ansible-collections/community.general/issues/9020,
          https://github.com/ansible-collections/community.general/pull/12640).
        - homebrew_cask - fix ``brew --version`` parsing to handle version strings
          with more than three dot-separated segments (for example, some vendor Homebrew
          builds report a fourth segment). The previous regex could silently drop
          the leading segment, misjudging whether the deprecated ``brew cask`` command
          syntax is still required and causing installs to fail with an unknown-command
          error (https://github.com/ansible-collections/community.general/pull/12559).
        - htpasswd - fix ``hash_scheme`` aliases and Apache-compatible ``bcrypt``
          hashes (https://github.com/ansible-collections/community.general/issues/6135,
          https://github.com/ansible-collections/community.general/pull/12123).
        - icinga2 inventory plugin - mark the ``password`` option as sensitive so
          that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - icinga2_host - fix ``JSONDecodeError`` raised when the Icinga2 API returns
          an HTTP error response (https://github.com/ansible-collections/community.general/pull/12687,
          https://github.com/ansible-collections/community.general/issues/4948).
        - idrac_redfish_config - fix setting attributes on iDRAC10 (https://github.com/ansible-collections/community.general/issues/10232,
          https://github.com/ansible-collections/community.general/pull/13141).
        - 'incus connection plugin - detect failed ``incus file push``/``incus file
          pull`` transfers and raise a clear error naming the instance and the CLI
          stderr, instead of silently reporting success and failing later with a misleading
          ``chmod: No such file or directory`` error (https://github.com/ansible-collections/community.general/pull/12464).'
        - incus connection plugin - improve Windows PowerShell argv handling by stripping
          wrapper quotes from payload arguments for ``-enc``, ``-encodedcommand``,
          ``-command``, ``-c``, ``-file`` and ``-f`` (https://github.com/ansible-collections/community.general/issues/12161,
          https://github.com/ansible-collections/community.general/pull/12158).
        - incus connection plugin - return ``stdout``/``stderr`` as bytes instead
          of strings to restore compatibility with ansible-core 2.21 module execution
          (https://github.com/ansible-collections/community.general/issues/12161,
          https://github.com/ansible-collections/community.general/pull/12158).
        - influxdb_retention_policy - fix ``TypeError`` when altering a retention
          policy without ``shard_group_duration`` set (https://github.com/ansible-collections/community.general/issues/3897,
          https://github.com/ansible-collections/community.general/pull/12652).
        - ini_file - do not add an option without value when ``allow_no_value=true``
          and the requested values already exist (https://github.com/ansible-collections/community.general/issues/9296,
          https://github.com/ansible-collections/community.general/pull/13089).
        - ini_file - do not delete comment-only lines that contain the option name
          (https://github.com/ansible-collections/community.general/issues/11919,
          https://github.com/ansible-collections/community.general/pull/12083).
        - ip_netns - fix namespace existence checks when one namespace name is a prefix
          of another (https://github.com/ansible-collections/community.general/issues/12731,
          https://github.com/ansible-collections/community.general/pull/12743).
        - ip_netns - report no change in check mode for ``state=present`` when the
          requested namespace already exists (https://github.com/ansible-collections/community.general/issues/12839,
          https://github.com/ansible-collections/community.general/pull/12842).
        - ipa_hostgroup - fix task failure when it actually succeeded (https://github.com/ansible-collections/community.general/issues/12853,
          https://github.com/ansible-collections/community.general/pull/12854).
        - ipa_user - send only changed attributes when modifying a user (https://github.com/ansible-collections/community.general/issues/8296,
          https://github.com/ansible-collections/community.general/pull/13078).
        - ipa_user - set ``krbpasswordexpiration`` in a separate request after the
          password, because FreeIPA resets the expiration date when an administrator
          sets the password (https://github.com/ansible-collections/community.general/issues/12850,
          https://github.com/ansible-collections/community.general/pull/13171).
        - iptables_state - refactor code to avoid unnecessary unused variables and
          improve internal state handling (https://github.com/ansible-collections/community.general/pull/12093).
        - iso_create - fix failure with non-conforming ISO9660 path characters (https://github.com/ansible-collections/community.general/issues/5103,
          https://github.com/ansible-collections/community.general/pull/12028).
        - jabber - do not send an unnecessary ``muc#user`` tag on groupchat messages
          (https://github.com/ansible-collections/community.general/pull/12658, https://github.com/ansible-collections/community.general/issues/5343).
        - jabber callback plugin - mark the ``password`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - java_cert - detect silent ``keytool`` failures by verifying the import outcome
          after the command exits with ``rc=0`` (https://github.com/ansible-collections/community.general/issues/6685,
          https://github.com/ansible-collections/community.general/pull/12238).
        - java_cert - fix ``NullPointerException`` when importing from a PKCS12 file
          with a password on Java 8 (https://github.com/ansible-collections/community.general/issues/3023,
          https://github.com/ansible-collections/community.general/pull/12151).
        - 'jenkins_job_info - fix ``KeyError: ''color''`` when filtering folder jobs
          by color (https://github.com/ansible-collections/community.general/issues/12232),
          https://github.com/ansible-collections/community.general/pull/12369).'
        - ksu become plugin - mark the ``become_pass`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - launchd - fix ``restarted`` and ``reloaded`` states always reporting ``changed=False``
          (https://github.com/ansible-collections/community.general/issues/6199, https://github.com/ansible-collections/community.general/pull/12122).
        - ldap_attrs - when the server raises ``INAPPROPRIATE_MATCHING`` because an
          attribute has no EQUALITY matching rule (for example, certain ``olcTLS*``
          attributes on older OpenLDAP versions), the module now falls back to Python-side
          value comparison instead of crashing (https://github.com/ansible-collections/community.general/issues/3559,
          https://github.com/ansible-collections/community.general/issues/12596, https://github.com/ansible-collections/community.general/pull/12628).
        - linode inventory plugin - mark the ``access_token`` option as sensitive
          so that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - log_plays callback plugin - change type of the ``log_folder`` option from
          ``str`` to ``path`` (https://github.com/ansible-collections/community.general/issues/5389,
          https://github.com/ansible-collections/community.general/pull/13047).
        - loganalytics_ingestion callback plugin - mark the ``shared_key`` option
          as sensitive so that ansible-core 2.22+ will automatically redact its values
          in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - logdna callback plugin - mark the ``conf_key`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - logentries callback plugin - mark the ``token`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - lvol - fix a hang when ensuring an LVM snapshot that already exists (https://github.com/ansible-collections/community.general/issues/12477,
          https://github.com/ansible-collections/community.general/pull/12810).
        - lxc_container - fix ``create_script`` to accept a single tuple argument,
          resolving a ``TypeError`` that silently prevented ``container_command``
          from being executed (https://github.com/ansible-collections/community.general/issues/11360,
          https://github.com/ansible-collections/community.general/pull/12106).
        - lxc_container - fix archiving containers on LXC 2.1 and newer, which failed
          with ``KeyError`` because the module read the removed ``lxc.rootfs`` config
          key instead of ``lxc.rootfs.path`` (https://github.com/ansible-collections/community.general/issues/12562,
          https://github.com/ansible-collections/community.general/pull/12982).
        - 'lxd connection plugin - detect failed ``lxc file push``/``lxc file pull``
          transfers and raise a clear error naming the instance and the CLI stderr,
          instead of silently reporting success and failing later with a misleading
          ``chmod: No such file or directory`` error (https://github.com/ansible-collections/community.general/pull/12464).'
        - lxd inventory plugin - mark the ``trust_password`` option as sensitive so
          that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - machinectl become plugin - mark the ``become_pass`` option as sensitive
          so that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - mail - fail when an encrypted connection cannot be established with ``secure=always``,
          instead of sending the mail unencrypted (https://github.com/ansible-collections/community.general/pull/13068).
        - mail - open only one connection to the SMTP server instead of two (https://github.com/ansible-collections/community.general/pull/13069).
        - mail - report connection errors such as a refused connection as a module
          failure instead of a traceback (https://github.com/ansible-collections/community.general/issues/7122,
          https://github.com/ansible-collections/community.general/pull/13067).
        - modules using ``CmdRunner`` - environment variables set for a single command
          are no longer passed to subsequent commands (https://github.com/ansible-collections/community.general/issues/12904,
          https://github.com/ansible-collections/community.general/pull/12905).
        - nmcli - add ``bond_mode_behavior`` to control whether omitted ``mode`` preserves
          the existing bond mode or uses the legacy ``balance-rr`` default on existing
          connections (https://github.com/ansible-collections/community.general/issues/9201,
          https://github.com/ansible-collections/community.general/pull/12114).
        - nmcli - fail when the connection editor reports an error instead of reporting
          a change (https://github.com/ansible-collections/community.general/issues/9091,
          https://github.com/ansible-collections/community.general/pull/13116).
        - nmcli - fix ``wifi_sec`` flags options always reporting changes and failing
          with integer values (https://github.com/ansible-collections/community.general/issues/9121,
          https://github.com/ansible-collections/community.general/pull/13080).
        - nmcli - fix check/diff reporting changes for bond ``arp_interval`` and ``arp_ip_target``
          options when they are already configured (https://github.com/ansible-collections/community.general/issues/11588,
          https://github.com/ansible-collections/community.general/pull/12085).
        - nmcli - fix incorrectly reports diff for bond connections when ``mtu`` is
          unset and NetworkManager reports no explicit MTU value (https://github.com/ansible-collections/community.general/pull/12085).
        - nmcli - fix list suboptions of ``wifi`` and ``wifi_sec`` being sent to nmcli
          one character at a time when given as a string (https://github.com/ansible-collections/community.general/issues/7500,
          https://github.com/ansible-collections/community.general/pull/13072).
        - nmcli - now handles connection names derived from MAC addresses, and generally
          names that contain ``:`` or ``\\`` (https://github.com/ansible-collections/community.general/issues/12386,
          https://github.com/ansible-collections/community.general/pull/12387).
        - npm - fix ``JSONDecodeError`` when npm's stdout output contains warnings
          or notices alongside the JSON payload (https://github.com/ansible-collections/community.general/pull/12665,
          https://github.com/ansible-collections/community.general/issues/4960).
        - nrdp callback plugin - mark the ``token`` option as sensitive so that ansible-core
          2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - onepassword lookup plugin - the ``op://`` secret reference lookup returned
          raw bytes instead of a string, which broke passing the value into other
          modules (https://github.com/ansible-collections/community.general/pull/11958).
        - onepassword, onepassword_doc, onepassword_raw, and onepassword_ssh_key lookup
          plugins - mark the ``master_password``, ``secret_key``, ``service_account_token``,
          and ``connect_token`` options as sensitive so that ansible-core 2.22+ will
          automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - online inventory plugin - mark the ``oauth_token`` option as sensitive so
          that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - open_iscsi - fix login to a single target ignoring login failures and the
          ``portal`` option (https://github.com/ansible-collections/community.general/pull/12928).
        - opennebula inventory plugin - coerce ``SSH_PORT`` to an integer before setting
          ``ansible_port`` (https://github.com/ansible-collections/community.general/pull/12437).
        - opennebula inventory plugin - fix crash when retrieving VM without NIC (https://github.com/ansible-collections/community.general/pull/12361).
        - opennebula inventory plugin - mark the ``api_password`` option as sensitive
          so that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - opentelemetry callback plugin - each host's span event now carries that
          host's task result instead of the result of the host that reported last
          (https://github.com/ansible-collections/community.general/issues/12987,
          https://github.com/ansible-collections/community.general/pull/13011).
        - opentelemetry callback plugin - fix ``KeyError`` when a meta task is skipped
          by its ``when`` condition (https://github.com/ansible-collections/community.general/issues/12833,
          https://github.com/ansible-collections/community.general/pull/12837).
        - opkg - correctly set executable search path (https://github.com/ansible-collections/community.general/pull/12182).
        - pacemaker_cluster - skip ``pcs cluster start`` in ``state=online`` when
          the cluster is already running, improving idempotency and allowing maintenance
          mode to be disabled without pcsd connectivity (https://github.com/ansible-collections/community.general/issues/12362,
          https://github.com/ansible-collections/community.general/pull/12403).
        - pacemaker_resource - fix bug where the resource-ready state check did not
          recognize all valid ready states, causing the module to time out on resources
          that never reach the ``Started`` state (https://github.com/ansible-collections/community.general/issues/12351,
          https://github.com/ansible-collections/community.general/pull/12355).
        - pacemaker_resource - fix non-idempotent behaviour when ``state=cloned``
          is applied to a resource or group that is already part of a clone set (https://github.com/ansible-collections/community.general/issues/12217,
          https://github.com/ansible-collections/community.general/pull/12288).
        - pacman - tolerate the AUR package age badge (for example ``[9d2h]``) that
          AUR helpers such as ``yay`` append to the ``--query --upgrades`` output,
          instead of failing with an ``Invalid line`` error (https://github.com/ansible-collections/community.general/pull/12857).
        - pamd - fix crash when removing a rule that is the only line in the file
          with ``state=absent`` (https://github.com/ansible-collections/community.general/pull/13115).
        - pamd - handle non-PAM lines such as authselect template directives without
          crashing (https://github.com/ansible-collections/community.general/issues/5850,
          https://github.com/ansible-collections/community.general/pull/12137).
        - parted - ignore MBR partition type codes (for example ``type=8e``) reported
          as flags by some parted builds (for example on SUSE), which cannot be managed
          via the ``set`` command (https://github.com/ansible-collections/community.general/issues/6292,
          https://github.com/ansible-collections/community.general/pull/12121).
        - passwordstore lookup plugin - do not return the folder tree as the password
          when the passname is a folder with ``backend=gopass`` (https://github.com/ansible-collections/community.general/issues/5028,
          https://github.com/ansible-collections/community.general/pull/13167).
        - passwordstore lookup plugin - mark the ``userpass`` option as sensitive
          so that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - pbrun become plugin - mark the ``become_pass`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - pfexec become plugin - mark the ``become_pass`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - pkgng - fix ``state=latest`` for specific packages on FreeBSD 14.4+ (https://github.com/ansible-collections/community.general/issues/11907,
          https://github.com/ansible-collections/community.general/pull/12789).
        - pkgng - fix failure to install packages when the package repository has
          never been updated (https://github.com/ansible-collections/community.general/pull/12507).
        - pkgng - the module no longer hangs forever when ``pkg`` asks an interactive
          question, such as the one about an OS version mismatch; the question now
          takes its default answer, so the task fails instead of blocking (https://github.com/ansible-collections/community.general/issues/12896,
          https://github.com/ansible-collections/community.general/pull/12898).
        - pmrun become plugin - mark the ``become_pass`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - 'portage - fix ``depclean: true`` crashing with ``AnsibleModule.fail_json()
          missing 1 required positional argument: ''msg''`` instead of reporting the
          actual emerge failure (https://github.com/ansible-collections/community.general/pull/12168).'
        - proton_pass lookup plugin - mark the ``pat`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - proton_pass lookup plugin - use ``pass-cli info`` instead of the removed
          ``pass-cli test`` command when checking for an active session, restoring
          session detection with ``pass-cli`` 2.2.4 and later (https://github.com/ansible-collections/community.general/pull/12639).
        - redfish_command - add workaround in ``VirtualMediaInsert`` for Supermicro
          systems to treat slots marked as ``NotConnected`` as empty (https://github.com/ansible-collections/community.general/issues/6969,
          https://github.com/ansible-collections/community.general/pull/12537).
        - 'redfish_config - fix ``KeyError: ''ret''`` when ``SetManagerNic`` cannot
          find a matching NIC (https://github.com/ansible-collections/community.general/issues/5892,
          https://github.com/ansible-collections/community.general/pull/12124).'
        - revbitspss lookup plugin - mark the ``api_key`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - scaleway inventory plugin - mark the ``oauth_token`` option as sensitive
          so that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - scaleway_ip - fix failure when creating an IP with ``reverse`` set, and
          show the error details from the API when updating an IP fails (https://github.com/ansible-collections/community.general/issues/11362,
          https://github.com/ansible-collections/community.general/pull/13140).
        - sefcontext - fix idempotence of ``<<none>>`` file contexts (https://github.com/ansible-collections/community.general/pull/12561)
        - sesu become plugin - mark the ``become_pass`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - snap - enforce ``snap refresh --hold`` after installing at a specific revision
          (https://github.com/ansible-collections/community.general/issues/12088,
          https://github.com/ansible-collections/community.general/pull/12097).
        - snap - fix ``IndexError`` when a single snap does not exist (https://github.com/ansible-collections/community.general/issues/12375,
          https://github.com/ansible-collections/community.general/pull/12570).
        - splunk callback plugin - mark the ``authtoken`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - sudosu become plugin - mark the ``become_pass`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - supervisorctl - treat the ``BACKOFF`` process state as active so that ``state=started``
          does not fail on a program still being retried by ``supervisord`` (https://github.com/ansible-collections/community.general/issues/5599,
          https://github.com/ansible-collections/community.general/pull/12688).
        - sysrc - keep leading and trailing whitespace of the current value when comparing
          it, so setting a value that starts or ends with whitespace is idempotent,
          and report the correct change status for ``state=value_present`` and ``state=value_absent``
          when a list item has leading or trailing whitespace (https://github.com/ansible-collections/community.general/issues/13108,
          https://github.com/ansible-collections/community.general/pull/13117).
        - terraform - allow ``project_path`` to be a relative path without a ``/``,
          such as ``myproject`` (https://github.com/ansible-collections/community.general/issues/6463,
          https://github.com/ansible-collections/community.general/pull/12937).
        - terraform - fix return value ``command``, showing terraform plan name twice
          (https://github.com/ansible-collections/community.general/issues/12530,
          https://github.com/ansible-collections/community.general/pull/12540).
        - terraform - pass ``state_file`` to the ``apply`` and ``destroy`` commands,
          not only to ``plan`` (https://github.com/ansible-collections/community.general/issues/6490,
          https://github.com/ansible-collections/community.general/pull/12997).
        - timezone - fix failure when setting timezone aliases on Debian and Ubuntu
          without systemd (https://github.com/ansible-collections/community.general/issues/7498,
          https://github.com/ansible-collections/community.general/pull/13169).
        - timezone - no longer requires the ``hwclock`` executable for name-only changes
          on non-systemd systems (https://github.com/ansible-collections/community.general/issues/12516,
          https://github.com/ansible-collections/community.general/pull/12526).
        - timezone - update ``/etc/timezone`` when using ``timedatectl`` (https://github.com/ansible-collections/community.general/issues/8784,
          https://github.com/ansible-collections/community.general/pull/13074).
        - tss lookup plugin - mark the ``password`` and ``token`` options as sensitive
          so that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - udm_dns_record - normalize IPv6 addresses in ``data`` to expanded form to
          fix idempotency (https://github.com/ansible-collections/community.general/issues/317,
          https://github.com/ansible-collections/community.general/pull/12149).
        - ufw - do not reload the default policy when it is already set to the requested
          value (https://github.com/ansible-collections/community.general/issues/1843,
          https://github.com/ansible-collections/community.general/pull/12590).
        - ufw - fix IPv6 rule determination and ``insert_relative_to`` (https://github.com/ansible-collections/community.general/pull/12531).
        - unixy callback - handle missing ``ansible_host`` in delegated vars when
          a task is delegated to a host without it set, such as ``localhost`` (https://github.com/ansible-collections/community.general/issues/12112,
          https://github.com/ansible-collections/community.general/pull/12113).
        - wsl connection plugin - mark the ``password`` option as sensitive so that
          ansible-core 2.22+ will automatically redact its values in outputs (https://github.com/ansible-collections/community.general/pull/12723).
        - xen_orchestra inventory plugin - mark the ``password`` option as sensitive
          so that ansible-core 2.22+ will automatically redact its values in outputs
          (https://github.com/ansible-collections/community.general/pull/12723).
        - xenserver_guest - skip provisioning when existing VM is used as a template
          (https://github.com/ansible-collections/community.general/issues/12576,
          https://github.com/ansible-collections/community.general/pull/12717).
        - xenserver_guest_info - use fallback chain for determining VDI format from
          ``sm_config`` keys ``image-format``, ``vdi_type``, ``type``, defaulting
          to ``raw`` (https://github.com/ansible-collections/community.general/pull/12119,
          https://github.com/ansible-collections/community.general/pull/12215).
        - xml - fix crash and idempotency of namespaced ``attribute`` values (https://github.com/ansible-collections/community.general/issues/10683,
          https://github.com/ansible-collections/community.general/pull/13121).
        - xml - preserve DOCTYPE declaration when writing modified XML files (https://github.com/ansible-collections/community.general/issues/2762,
          https://github.com/ansible-collections/community.general/pull/12148).
        - zpool - fix idempotency of ``vdevs`` with short device names, symbolic links,
          partitions, multi-disk stripes, and role groups (https://github.com/ansible-collections/community.general/issues/10771,
          https://github.com/ansible-collections/community.general/issues/10744, https://github.com/ansible-collections/community.general/pull/12948).
        - zpool - fix idempotency of vdevs ``special`` and ``dedup`` (https://github.com/ansible-collections/community.general/issues/12744,
          https://github.com/ansible-collections/community.general/pull/12745).
        - zypper - do not fail when zypper returns ``102`` (reboot needed) after a
          successful run, for example when applying patches with ``--with-interactive``
          (https://github.com/ansible-collections/community.general/issues/12960,
          https://github.com/ansible-collections/community.general/pull/12965).
        - zypper - do not pass ``extra_args`` to the ``zypper search`` command used
          to determine the installed packages (https://github.com/ansible-collections/community.general/issues/4242,
          https://github.com/ansible-collections/community.general/pull/12958).
        - zypper - fail when ``zypper`` reports errors while run through ``transactional-update``
          versions that return success regardless (https://github.com/ansible-collections/community.general/issues/9011,
          https://github.com/ansible-collections/community.general/pull/12957).
        - zypper - fix version specifier parsing when the version contains non-numeric
          characters, which caused packages to not be removed or installed (https://github.com/ansible-collections/community.general/pull/12588,
          https://github.com/ansible-collections/community.general/issues/6564).
        - zypper_repository - fix ``enabled``, ``autorefresh``, and ``gpgcheck`` module
          parameters being overridden by values read from a ``.repo`` file (https://github.com/ansible-collections/community.general/issues/8783,
          https://github.com/ansible-collections/community.general/pull/12022).
        - zypper_repository - fix idempotency when the repository URL contains ``$releasever``
          on openSUSE Leap 16.0 (https://github.com/ansible-collections/community.general/pull/13017).
