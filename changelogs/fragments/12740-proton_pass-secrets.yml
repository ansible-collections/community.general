bugfixes:
  - |-
    proton_pass lookup plugin - on ansible-core 2.22+, values of the following fields that are returned by the plugin
    will be automatically registered as secrets:
  
    * ``password`` and ``totp_uri`` login fields;
    * ``number``, ``verification_number``, and ``pin`` credit card fields;
    * ``password`` WiFi field;
    * ``private_key`` SSH key field;
    * ``social_security_number``, ``passport_number``, and ``license_number`` identity fields;
    * extra fields of type ``Hidden`` or ``Totp``

    (https://github.com/ansible-collections/community.general/pull/12740).
