bugfixes:
  - terraform - pass ``state_file`` to the ``apply`` and ``destroy`` commands, not only to ``plan``. Before, ``state=present`` failed with ``Saved plan does not match the given state`` when the plan had changes, and ``state=absent`` did not destroy the resources tracked in ``state_file`` (https://github.com/ansible-collections/community.general/issues/6490, https://github.com/ansible-collections/community.general/pull/12997).
