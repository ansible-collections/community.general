---
test_cases:
  - id: set_new_value
    input:
      name: test_flags
      value: -t
    output:
      changed: true
    mocks:
      run_command:
        - command: [/testbin/sysrc, -f, /etc/rc.conf, -v, -n, test_flags]
          rc: 1
          out: ''
          err: |
            sysrc: unknown variable 'test_flags'
        - command: [/testbin/sysrc, -f, /etc/rc.conf, test_flags=-t]
          rc: 0
          out: |
            test_flags:  -> -t
          err: ''
  - id: value_unchanged
    input:
      name: test_flags
      value: -t
    output:
      changed: false
    mocks:
      run_command:
        - command: [/testbin/sysrc, -f, /etc/rc.conf, -v, -n, test_flags]
          rc: 0
          out: |
            /etc/rc.conf: -t
          err: ''
  - id: value_with_leading_whitespace_unchanged
    input:
      name: test_flags
      value: ' -t'
    output:
      changed: false
    mocks:
      run_command:
        - command: [/testbin/sysrc, -f, /etc/rc.conf, -v, -n, test_flags]
          rc: 0
          out: |
            /etc/rc.conf:  -t
          err: ''
  - id: value_with_trailing_whitespace_unchanged
    input:
      name: test_flags
      value: '-t '
    output:
      changed: false
    mocks:
      run_command:
        - command: [/testbin/sysrc, -f, /etc/rc.conf, -v, -n, test_flags]
          rc: 0
          out: "/etc/rc.conf: -t \n"
          err: ''
  - id: whitespace_only_differs
    input:
      name: test_flags
      value: ' -t'
    output:
      changed: true
    mocks:
      run_command:
        - command: [/testbin/sysrc, -f, /etc/rc.conf, -v, -n, test_flags]
          rc: 0
          out: |
            /etc/rc.conf: -t
          err: ''
        - command: [/testbin/sysrc, -f, /etc/rc.conf, test_flags= -t]
          rc: 0
          out: |
            test_flags: -t ->  -t
          err: ''
  - id: get_value
    input:
      name: test_flags
    output:
      changed: false
      value: ' -t'
    mocks:
      run_command:
        - command: [/testbin/sysrc, -f, /etc/rc.conf, -v, -n, test_flags]
          rc: 0
          out: |
            /etc/rc.conf:  -t
          err: ''
  - id: value_present_with_trailing_whitespace
    input:
      name: test_list
      value: 'b '
      delim: ','
      state: value_present
    output:
      changed: true
    mocks:
      run_command:
        - command: [/testbin/sysrc, -f, /etc/rc.conf, -v, -n, test_list]
          rc: 0
          out: |
            /etc/rc.conf: a
          err: ''
        - command: [/testbin/sysrc, -f, /etc/rc.conf, 'test_list+=,b ']
          rc: 0
          out: "test_list: a -> a,b \n"
          err: ''
