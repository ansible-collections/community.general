---
anchors:
  env: &env {data: null, check_rc: false, binary_data: true, encoding: null, environ_update: null}
  item_json: &item_json '{"fields": [{"id": "password", "label": "password", "value": "secret123"}]}'
  document_json: &document_json '{"id": "doc123", "title": "My Document", "category": "DOCUMENT", "files": [{"id": "file1", "name": "notes.txt"}]}'
  account_list: &account_list
    command: [op, account, list]
    environ: *env
    rc: 0
    out: "account info\n"
    err: ''
  account_get: &account_get
    command: [op, account, get]
    environ: *env
    rc: 0
    out: ''
    err: ''
  account_list_mycompany_empty: &account_list_mycompany_empty
    command: [op, account, list, --account, mycompany.1password.com]
    environ: *env
    rc: 0
    out: ''
    err: ''
  account_add_mycompany: &account_add_mycompany
    command: [op, account, add, --raw, --address, mycompany.1password.com, --email, user@example.com, --signin]
    environ: {<<: *env, data: masterpass, environ_update: {OP_SECRET_KEY: mysecretkey}}
    rc: 0
    out: "mytoken\n"
    err: ''
  item_get_with_token: &item_get_with_token
    command: [op, item, get, My Item, --format, json, --session=mytoken]
    environ: *env
    rc: 0
    out: *item_json
    err: ''

test_cases:
  - id: already_logged_in
    input:
      search_terms:
        - name: My Item
    output:
      changed: false
      onepassword:
        "My Item":
          password: secret123
    mocks:
      run_command:
        - *account_list
        - *account_get
        - command: [op, item, get, My Item, --format, json]
          environ: *env
          rc: 0
          out: *item_json
          err: ''

  - id: already_logged_in_with_vault
    input:
      search_terms:
        - name: My Item
          vault: Personal
    output:
      changed: false
      onepassword:
        "My Item":
          password: secret123
    mocks:
      run_command:
        - *account_list
        - *account_get
        - command: [op, item, get, My Item, --format, json, --vault=Personal]
          environ: *env
          rc: 0
          out: *item_json
          err: ''

  - id: already_logged_in_section_field
    input:
      search_terms:
        - name: My Item
          field: Custom Field
          section: My Section
    output:
      changed: false
      onepassword:
        "My Item":
          Custom Field: custom_value
    mocks:
      run_command:
        - *account_list
        - *account_get
        - command: [op, item, get, My Item, --format, json]
          environ: *env
          rc: 0
          out: >-
            {"fields": [{"id": "abc", "label": "Custom Field", "value": "custom_value",
            "section": {"id": "sec_id", "label": "My Section"}}]}
          err: ''

  - id: item_not_found
    input:
      search_terms:
        - name: Missing Item
    output:
      failed: true
      msg: "Unable to find an item in 1Password named 'Missing Item'."
    mocks:
      run_command:
        - *account_list
        - *account_get
        - command: [op, item, get, Missing Item, --format, json]
          environ: *env
          rc: 1
          out: ''
          err: '[ERROR] 2026/10/10 12:00:00 "Missing Item" isn''t an item in the "Private" vault. Specify the item with its UUID, name, or domain.'

  - id: field_not_found
    input:
      search_terms:
        - name: My Item
          field: nonexistent
    output:
      failed: true
      msg: "Unable to find an item in 1Password named 'My Item' with the field 'nonexistent'."
    mocks:
      run_command:
        - *account_list
        - *account_get
        - command: [op, item, get, My Item, --format, json]
          environ: *env
          rc: 0
          out: *item_json
          err: ''

  - id: field_with_empty_value
    input:
      search_terms:
        - name: My Item
          field: notesPlain
    output:
      changed: false
      onepassword:
        "My Item":
          notesPlain: ''
    mocks:
      run_command:
        - *account_list
        - *account_get
        - command: [op, item, get, My Item, --format, json]
          environ: *env
          rc: 0
          out: '{"fields": [{"id": "notesPlain", "label": "notesPlain", "value": ""}]}'
          err: ''

  - id: document_item
    input:
      search_terms:
        - name: My Document
          vault: Personal
    output:
      changed: false
      onepassword:
        "My Document":
          document: document contents
    mocks:
      run_command:
        - *account_list
        - *account_get
        - command: [op, item, get, My Document, --format, json, --vault=Personal]
          environ: *env
          rc: 0
          out: *document_json
          err: ''
        - command: [op, document, get, My Document]
          environ: *env
          rc: 0
          out: "document contents\n"
          err: ''

  - id: not_logged_in_no_auto_login
    input:
      search_terms:
        - name: My Item
    output:
      failed: true
      msg: >-
        Unable to perform an initial sign in to 1Password. Please run 'op signin' or define credentials in 'auto_login'.
        See the module documentation for details.
    mocks:
      run_command:
        - command: [op, account, list]
          environ: *env
          rc: 0
          out: ''
          err: ''
      onepassword_config:
        config_file_path: /home/user/.config/op/config
        config_file_exists: false

  - id: signin_with_existing_config
    input:
      search_terms:
        - name: My Item
      auto_login:
        subdomain: mycompany
        master_password: masterpass
    output:
      changed: false
      onepassword:
        "My Item":
          password: secret123
    mocks:
      run_command:
        - *account_list_mycompany_empty
        - command: [op, signin, --raw, --account, mycompany]
          environ: {<<: *env, data: masterpass}
          rc: 0
          out: "mytoken\n"
          err: ''
        - *item_get_with_token
      onepassword_config:
        config_file_path: /home/user/.config/op/config

  - id: signin_fails_falls_back_to_full_signin
    input:
      search_terms:
        - name: My Item
      auto_login:
        subdomain: mycompany
        username: user@example.com
        secret_key: mysecretkey
        master_password: masterpass
    output:
      changed: false
      onepassword:
        "My Item":
          password: secret123
    mocks:
      run_command:
        - *account_list_mycompany_empty
        - command: [op, signin, --raw, --account, mycompany]
          environ: {<<: *env, data: masterpass}
          rc: 1
          out: ''
          err: some error
        - *account_add_mycompany
        - *item_get_with_token
      onepassword_config:
        config_file_path: /home/user/.config/op/config

  - id: signin_fails_without_full_credentials
    input:
      search_terms:
        - name: My Item
      auto_login:
        subdomain: mycompany
        master_password: wrongpass
    output:
      failed: true
      msg: >-
        Unable to perform initial sign in to 1Password.
        subdomain, username, secret_key, and master_password are required to perform initial sign in.
    mocks:
      run_command:
        - *account_list_mycompany_empty
        - command: [op, signin, --raw, --account, mycompany]
          environ: {<<: *env, data: wrongpass}
          rc: 1
          out: ''
          err: '[ERROR] 2026/10/10 12:00:00 Unauthorized: You aren''t authorized to perform this action.'
      onepassword_config:
        config_file_path: /home/user/.config/op/config

  - id: full_signin_without_config
    input:
      search_terms:
        - name: My Item
      auto_login:
        subdomain: mycompany
        username: user@example.com
        secret_key: mysecretkey
        master_password: masterpass
    output:
      changed: false
      onepassword:
        "My Item":
          password: secret123
    mocks:
      run_command:
        - *account_list_mycompany_empty
        - *account_add_mycompany
        - *item_get_with_token
      onepassword_config:
        config_file_path: /home/user/.config/op/config
        config_file_exists: false

  - id: full_signin_fails
    input:
      search_terms:
        - name: My Item
      auto_login:
        subdomain: mycompany
        username: user@example.com
        secret_key: mysecretkey
        master_password: masterpass
    output:
      failed: true
      msg: "Failed to perform initial sign in to 1Password: some error"
    mocks:
      run_command:
        - *account_list_mycompany_empty
        - command: [op, account, add, --raw, --address, mycompany.1password.com, --email, user@example.com, --signin]
          environ: {<<: *env, data: masterpass, environ_update: {OP_SECRET_KEY: mysecretkey}}
          rc: 1
          out: ''
          err: some error
      onepassword_config:
        config_file_path: /home/user/.config/op/config
        config_file_exists: false
