- block:

    - ansible.builtin.import_tasks: setup.yml
      become: true

    - name: Mask app for check_mode tests with masked app
      community.general.flatpak_mask:
        name: check-mode-masked-app
        state: present
      become: true
      ignore_errors: true

    - ansible.builtin.import_tasks: check_mode.yml
      become: true

    - ansible.builtin.import_tasks: test.yml
      become: false
      vars:
        method: user

    - ansible.builtin.import_tasks: test.yml
      become: true
      vars:
        method: system

  always:

    - name: Cleanup masked apps
      community.general.flatpak_mask:
        name: "{{ item }}"
        state: absent
      loop:
        - io.github.shiftey.Desktop
        - check-mode-masked-app
      ignore_errors: true
      become: true

  when: ansible_facts.distribution in ['Fedora', 'Ubuntu']
