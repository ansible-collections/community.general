- name: Install flatpak on Fedora
  ansible.builtin.dnf:
    name: flatpak
    state: present
  become: true
  when: ansible_facts.distribution == 'Fedora'

- name: Install flatpak package on Ubuntu
  ansible.builtin.apt:
    name: flatpak
    state: present
  when: ansible_facts.distribution == 'Ubuntu'
