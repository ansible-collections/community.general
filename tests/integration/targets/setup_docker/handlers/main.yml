# Keep it when using an existing docker daemon, other roles' handlers may still need it
- name: Remove python requests
  ansible.builtin.pip:
    name:
      - requests
    state: absent
  when: not (setup_docker_socket.stat.issock | default(false))

- name: Stop docker service
  become: true
  ansible.builtin.service:
    name: docker
    state: stopped

- name: Remove Docker packages
  ansible.builtin.package:
    name: "{{ docker_packages }}"
    state: absent

- name: "D-Fedora : Remove repository"
  ansible.builtin.file:
    path: /etc/yum.repos.d/docker-ce.repo
    state: absent

- name: "D-Fedora : Remove dnf-plugins-core"
  ansible.builtin.package:
    name: dnf-plugins-core
    state: absent
