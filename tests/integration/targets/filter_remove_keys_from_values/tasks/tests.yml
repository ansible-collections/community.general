- name: Tests
  ansible.builtin.assert:
    that:
      - (result | from_yaml) == i.0.result
      - i.0.result == (result | from_yaml)
    success_msg: |
      [OK] result:
      {{ result | to_yaml }}
    fail_msg: |
      [ERR] result:
      {{ result | to_yaml }}
    quiet: "{{ quiet_test | default(true) | bool }}"
  loop: "{{ tests | subelements('group') }}"
  loop_control:
    loop_var: i
    label: "{{ i.1.tt }}"
  vars:
    input: "{{ i.0.input }}"
    result: "{{ lookup('template', i.0.template) }}"
