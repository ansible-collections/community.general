- name: Run tests
  ansible.builtin.include_role:
    name: callback
  vars:
    tests:
      - name: Task and host counters shown in N/M format
        environment:
          ANSIBLE_NOCOLOR: 'true'
          ANSIBLE_FORCE_COLOR: 'false'
          ANSIBLE_STDOUT_CALLBACK: community.general.counter_enabled
        playbook: |
          - hosts: testhost
            gather_facts: false
            tasks:
              - name: First task
                ansible.builtin.set_fact:
                  counter_test: first
              - name: Second task
                ansible.builtin.set_fact:
                  counter_test: second
        expected_output:
          - ""
          - "PLAY [testhost] ****************************************************************"
          - ""
          - "TASK 1/2 [First task] **********************************************************"
          - "ok: 1/1 [testhost]"
          - ""
          - "TASK 2/2 [Second task] *********************************************************"
          - "ok: 1/1 [testhost]"
          - ""
          - "PLAY RECAP *********************************************************************"
          - "testhost                   : ok=2    changed=0    unreachable=0    failed=0    rescued=0    ignored=0   "

      - name: Loop task items are displayed (regression for issue 8187)
        environment:
          ANSIBLE_NOCOLOR: 'true'
          ANSIBLE_FORCE_COLOR: 'false'
          ANSIBLE_STDOUT_CALLBACK: community.general.counter_enabled
        playbook: !unsafe |
          - hosts: testhost
            gather_facts: false
            tasks:
              - name: Loop task
                ansible.builtin.set_fact:
                  dummy_fact: "{{ item }}"
                loop:
                  - item_a
                  - item_b
                  - item_c
        expected_output:
          - ""
          - "PLAY [testhost] ****************************************************************"
          - ""
          - "TASK 1/1 [Loop task] ***********************************************************"
          - "ok: [testhost] => (item=item_a)"
          - "ok: [testhost] => (item=item_b)"
          - "ok: [testhost] => (item=item_c)"
          - ""
          - "PLAY RECAP *********************************************************************"
          - "testhost                   : ok=1    changed=0    unreachable=0    failed=0    rescued=0    ignored=0   "

      - name: Delegated loop task items show delegation target (regression for issue 8187)
        environment:
          ANSIBLE_NOCOLOR: 'true'
          ANSIBLE_FORCE_COLOR: 'false'
          ANSIBLE_STDOUT_CALLBACK: community.general.counter_enabled
        playbook: !unsafe |
          - hosts: testhost
            gather_facts: false
            tasks:
              - name: Delegated loop task
                ansible.builtin.set_fact:
                  dummy_fact: "{{ item }}"
                loop:
                  - item_a
                  - item_b
                  - item_c
                delegate_to: localhost
        expected_output:
          - ""
          - "PLAY [testhost] ****************************************************************"
          - ""
          - "TASK 1/1 [Delegated loop task] *************************************************"
          - - "ok: [testhost -> localhost] => (item=item_a)"
            - "ok: [testhost -> localhost(127.0.0.1)] => (item=item_a)"
          - - "ok: [testhost -> localhost] => (item=item_b)"
            - "ok: [testhost -> localhost(127.0.0.1)] => (item=item_b)"
          - - "ok: [testhost -> localhost] => (item=item_c)"
            - "ok: [testhost -> localhost(127.0.0.1)] => (item=item_c)"
          - ""
          - "PLAY RECAP *********************************************************************"
          - "testhost                   : ok=1    changed=0    unreachable=0    failed=0    rescued=0    ignored=0   "

- name: Test the task total with included tasks
  block:
    - name: Create temporary tasks file
      ansible.builtin.tempfile:
        suffix: .yml
      register: included_tasks_file

    - name: Set temporary tasks file content
      ansible.builtin.copy:
        dest: "{{ included_tasks_file.path }}"
        content: |
          - name: First included task
            ansible.builtin.set_fact:
              counter_test: first
          - name: Second included task
            ansible.builtin.set_fact:
              counter_test: second

    - name: Run tests with included tasks
      ansible.builtin.include_role:
        name: callback
      vars:
        tests:
          - name: Task total grows with the task counter for included tasks (regression for issue 4053)
            environment:
              ANSIBLE_NOCOLOR: 'true'
              ANSIBLE_FORCE_COLOR: 'false'
              ANSIBLE_STDOUT_CALLBACK: community.general.counter_enabled
            playbook: |
              - hosts: testhost
                gather_facts: false
                tasks:
                  - name: Include tasks
                    ansible.builtin.include_tasks: "{{ included_tasks_file.path }}"
            expected_output:
              - ""
              - "PLAY [testhost] ****************************************************************"
              - ""
              - "TASK 1/1 [Include tasks] *******************************************************"
              - ""
              - "TASK 2/2 [First included task] *************************************************"
              - "ok: 1/1 [testhost]"
              - ""
              - "TASK 3/3 [Second included task] ************************************************"
              - "ok: 1/1 [testhost]"
              - ""
              - "PLAY RECAP *********************************************************************"
              - "testhost                   : ok=3    changed=0    unreachable=0    failed=0    rescued=0    ignored=0   "

  always:
    - name: Remove temporary tasks file
      ansible.builtin.file:
        path: "{{ included_tasks_file.path }}"
        state: absent
