# Handlers run in the order they are listed: devices must be detached
# before their backing files are removed.

- name: Detach ZFS devices
  ansible.builtin.command:
    cmd: "{{ setup_zfs_detach_cmd }} {{ item }}"
  loop: "{{ setup_zfs_devices }}"

- name: Remove ZFS backing files
  ansible.builtin.file:
    path: "{{ setup_zfs_tmp_dir.path }}"
    state: absent
