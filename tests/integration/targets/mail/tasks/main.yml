# TODO: Our current implementation does not handle SMTP authentication

- name: Install test smtpserver
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ remote_tmp_dir }}/{{ item }}'
  loop:
    - smtpserver.py
    - smtpserver.crt
    - smtpserver.key

# FIXME: Verify the mail after it was send would be nice
#        This would require either dumping the content, or registering async task output
- name: Start test smtpserver
  ansible.builtin.command: '{{ ansible_facts.python.executable }} {{ remote_tmp_dir }}/smtpserver.py 10025:10465'
  async: 45
  poll: 0
  register: smtpserver

- name: Wait for test smtpserver
  ansible.builtin.wait_for:
    port: '{{ item }}'
    timeout: 10
  loop:
    - 10025
    - 10465

- name: Send a basic test-mail
  community.general.mail:
    port: 10025
    subject: Test mail 1 (smtp)
    secure: never

- name: Send a test-mail with body and specific recipient
  community.general.mail:
    port: 10025
    from: ansible@localhost
    to: root@localhost
    subject: Test mail 2 (smtp + body)
    body: Test body 2
    secure: never

- name: Send a test-mail with attachment
  community.general.mail:
    port: 10025
    from: ansible@localhost
    to: root@localhost
    subject: Test mail 3 (smtp + body + attachment)
    body: Test body 3
    attach: /etc/group
    secure: never

- name: Send a test-mail using starttls
  community.general.mail:
    port: 10025
    from: ansible@localhost
    to: root@localhost
    subject: Test mail 4 (smtp + starttls + body + attachment)
    body: Test body 4
    attach: /etc/group
    secure: starttls

- name: Send a test-mail using TLS
  community.general.mail:
    port: 10465
    from: ansible@localhost
    to: root@localhost
    subject: Test mail 5 (smtp + tls + body + attachment)
    body: Test body 5
    attach: /etc/group
    secure: always

- name: Send a test-mail with body, specific recipient and specific ehlohost
  community.general.mail:
    port: 10025
    ehlohost: some.domain.tld
    from: ansible@localhost
    to: root@localhost
    subject: Test mail 6 (smtp + body + ehlohost)
    body: Test body 6
    secure: never

- name: Send a test-mail to a port with no listener
  community.general.mail:
    port: 10026
    subject: Test mail 7 (connection refused)
    secure: never
  ignore_errors: true
  register: connection_refused

- name: Assert connection error is reported as a module failure
  ansible.builtin.assert:
    that:
      - connection_refused is failed
      - connection_refused.msg is search('Unable to Connect')

- name: Send a test-mail with secure=always to a port with no listener
  community.general.mail:
    port: 10027
    subject: Test mail 8 (tls required, connection refused)
    secure: always
  ignore_errors: true
  register: tls_required_refused

- name: Assert no unencrypted connection is attempted with secure=always
  ansible.builtin.assert:
    that:
      - tls_required_refused is failed
      - tls_required_refused.msg is search('Unable to start an encrypted session')
