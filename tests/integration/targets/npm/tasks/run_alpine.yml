- name: Install nodejs and npm via apk
  community.general.apk:
    name:
      - sqlite-libs
      - nodejs
      - npm
    state: latest
    update_cache: true

- ansible.builtin.include_tasks: test.yml
  vars:
    node_path: /usr/bin
- ansible.builtin.include_tasks: no_bin_links.yml
  vars:
    node_path: /usr/bin
