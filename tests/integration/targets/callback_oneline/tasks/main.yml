- name: Run tests
  ansible.builtin.include_role:
    name: callback
  vars:
    tests:
      - name: Basic tests
        environment:
          # ANSIBLE_DISPLAY_TRACEBACK: error
          ANSIBLE_FORCE_COLOR: 'false'
          ANSIBLE_NOCOLOR: 'true'
          ANSIBLE_PYTHON_INTERPRETER: "{{ ansible_python_interpreter }}"
          ANSIBLE_STDOUT_CALLBACK: community.general.oneline
        playbook: !unsafe |
          - hosts: testhost
            gather_facts: false
            tasks:
              - name: First task
                ansible.builtin.set_fact:
                  counter_test: first
              - name: Second task
                ansible.builtin.set_fact:
                  counter_test: second
              - name: Loop task
                ansible.builtin.set_fact:
                  dummy_fact: "{{ item }}"
                loop:
                  - item_a
                  - item_b
                  - item_c
              - name: Command with stdout
                ansible.builtin.command:
                  cmd: echo Hello
              - name: Command with stderr
                ansible.builtin.shell:
                  cmd: echo Hello > /dev/stderr && exit 23
                failed_when: false
              - name: Fail
                ansible.builtin.fail:
                  msg: Boo!
                ignore_errors: true
        expected_output:
          - "testhost | SUCCESS => {\"ansible_facts\": {\"counter_test\": \"first\"},\"changed\": false}"
          - "testhost | SUCCESS => {\"ansible_facts\": {\"counter_test\": \"second\"},\"changed\": false}"
          - "testhost | SUCCESS => {\"changed\": false,\"msg\": \"All items completed\",\"results\": [{\"ansible_facts\": {\"dummy_fact\": \"item_a\"},\"ansible_loop_var\": \"item\",\"changed\": false,\"item\": \"item_a\"},{\"ansible_facts\": {\"dummy_fact\": \"item_b\"},\"ansible_loop_var\": \"item\",\"changed\": false,\"item\": \"item_b\"},{\"ansible_facts\": {\"dummy_fact\": \"item_c\"},\"ansible_loop_var\": \"item\",\"changed\": false,\"item\": \"item_c\"}]}"
          - "testhost | CHANGED | rc=0 | (stdout) Hello"
          - "testhost | CHANGED | rc=23 | (stdout)  (stderr) Hello"
          - "An exception occurred during task execution. To see the full traceback, use -vvv. The error was: (traceback unavailable)"
          - "testhost | FAILED! => {\"changed\": false,\"msg\": \"Boo!\"}"
