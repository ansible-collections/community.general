## regression for https://github.com/ansible-collections/community.general/issues/6173

- name: test-exclusive-allow-no-value 1 - create test file
  ansible.builtin.copy:
    content: |
      [test]
      active = false
    dest: "{{ output_file }}"

- name: test-exclusive-allow-no-value 1 - change the value of an existing option
  community.general.ini_file:
    path: "{{ output_file }}"
    section: test
    option: active
    value: "true"
    allow_no_value: true
    exclusive: true
  register: result_exclusive_allow_no_value_1

- name: test-exclusive-allow-no-value 1 - change the value of an existing option again
  community.general.ini_file:
    path: "{{ output_file }}"
    section: test
    option: active
    value: "true"
    allow_no_value: true
    exclusive: true
  register: result_exclusive_allow_no_value_1_idem

- name: test-exclusive-allow-no-value 1 - read content from output file
  ansible.builtin.slurp:
    src: "{{ output_file }}"
  register: output_content_exclusive_allow_no_value_1

- name: test-exclusive-allow-no-value 1 - set expected content and get current ini file content
  ansible.builtin.set_fact:
    expected_exclusive_allow_no_value_1: |
      [test]
      active = true
    content_exclusive_allow_no_value_1: "{{ output_content_exclusive_allow_no_value_1.content | ansible.builtin.b64decode }}"

- name: test-exclusive-allow-no-value 1 - assert the existing line is replaced
  ansible.builtin.assert:
    that:
      - result_exclusive_allow_no_value_1 is changed
      - result_exclusive_allow_no_value_1.msg == 'option changed'
      - result_exclusive_allow_no_value_1_idem is not changed
      - content_exclusive_allow_no_value_1 == expected_exclusive_allow_no_value_1


- name: test-exclusive-allow-no-value 2 - create test file
  ansible.builtin.copy:
    content: |
      [drinks]
      sparkling
      beverage = coke
      beverage = pepsi
    dest: "{{ output_file }}"

- name: test-exclusive-allow-no-value 2 - replace one of the values of an existing option
  community.general.ini_file:
    path: "{{ output_file }}"
    section: drinks
    option: beverage
    values:
      - coke
      - water
    allow_no_value: true
    exclusive: true
  register: result_exclusive_allow_no_value_2

- name: test-exclusive-allow-no-value 2 - replace one of the values of an existing option again
  community.general.ini_file:
    path: "{{ output_file }}"
    section: drinks
    option: beverage
    values:
      - coke
      - water
    allow_no_value: true
    exclusive: true
  register: result_exclusive_allow_no_value_2_idem

- name: test-exclusive-allow-no-value 2 - read content from output file
  ansible.builtin.slurp:
    src: "{{ output_file }}"
  register: output_content_exclusive_allow_no_value_2

- name: test-exclusive-allow-no-value 2 - set expected content and get current ini file content
  ansible.builtin.set_fact:
    expected_exclusive_allow_no_value_2: |
      [drinks]
      sparkling
      beverage = coke
      beverage = water
    content_exclusive_allow_no_value_2: "{{ output_content_exclusive_allow_no_value_2.content | ansible.builtin.b64decode }}"

- name: test-exclusive-allow-no-value 2 - assert the other value is replaced and the option without value is kept
  ansible.builtin.assert:
    that:
      - result_exclusive_allow_no_value_2 is changed
      - result_exclusive_allow_no_value_2.msg == 'option changed'
      - result_exclusive_allow_no_value_2_idem is not changed
      - content_exclusive_allow_no_value_2 == expected_exclusive_allow_no_value_2


- name: test-exclusive-allow-no-value 3 - set a value without an option
  community.general.ini_file:
    path: "{{ output_file }}"
    section: drinks
    value: water
    allow_no_value: true
  register: result_exclusive_allow_no_value_3

- name: test-exclusive-allow-no-value 3 - read content from output file
  ansible.builtin.slurp:
    src: "{{ output_file }}"
  register: output_content_exclusive_allow_no_value_3

- name: test-exclusive-allow-no-value 3 - assert the section is not changed
  ansible.builtin.assert:
    that:
      - result_exclusive_allow_no_value_3 is not changed
      - (output_content_exclusive_allow_no_value_3.content | ansible.builtin.b64decode) == expected_exclusive_allow_no_value_2
