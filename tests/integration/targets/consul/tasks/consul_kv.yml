- name: Create a key
  community.general.consul_kv:
    key: somekey
    value: somevalue
    token: "{{ consul_management_token }}"
  register: result

- ansible.builtin.assert:
    that:
      - result is changed
      - result.data.Value == 'somevalue'

# The consul_kv lookup always runs on the controller, so it can't be tested
# against the Consul agent started on the target host above; it has its own
# dedicated integration test target instead: lookup_consul_kv.

- name: Update a key with the same data
  community.general.consul_kv:
    key: somekey
    value: somevalue
    token: "{{ consul_management_token }}"
  register: result

- ansible.builtin.assert:
    that:
      - result is not changed
      - result.data.Value == 'somevalue'

- name: Remove a key from the store
  community.general.consul_kv:
    key: somekey
    state: absent
    token: "{{ consul_management_token }}"
  register: result

- ansible.builtin.assert:
    that:
      - result is changed
      - result.data.Value == 'somevalue'

- name: Remove a non-existant key from the store
  community.general.consul_kv:
    key: somekey
    state: absent
    token: "{{ consul_management_token }}"
  register: result

- ansible.builtin.assert:
    that:
      - result is not changed
      - not result.data