- name: Run serestorecon integration tests on supported distributions
  when: ansible_facts.os_family in ["Debian", "RedHat", "Suse"]
  block:
    - name: Install SELinux test requirements
      ansible.builtin.package:
        name:
          - coreutils
          - policycoreutils
          - policycoreutils-python-utils
        state: present

    - name: Refresh SELinux facts after installing requirements
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - selinux

    - name: Run serestorecon tests
      ansible.builtin.include_tasks:
        file: serestorecon.yml
      when:
        - ansible_facts.selinux is defined
        - ansible_facts.selinux is mapping
        - ansible_facts.selinux.status == "enabled"