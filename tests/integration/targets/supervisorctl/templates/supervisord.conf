[supervisord]
pidfile={{ remote_dir }}/supervisord.pid
logfile={{ remote_dir }}/supervisord.log

[program:py1]
command={{ ansible_facts.python.executable }} -i -u -
user={{ ansible_facts.user_id }}
autostart=false
autorestart=false
stdout_logfile={{ remote_dir }}/py1.log
redirect_stderr=yes

[program:py2]
command={{ ansible_facts.python.executable }} -i -u -
user={{ ansible_facts.user_id }}
autostart=false
autorestart=false
stdout_logfile={{ remote_dir }}/py2.log
redirect_stderr=yes

[program:always_fails]
command=/bin/sh -c "exit 1"
user={{ ansible_facts.user_id }}
autostart=false
autorestart=false
startsecs=1
startretries=2

[program:fails_twice]
command=/bin/sh {{ remote_dir }}/fails_twice.sh {{ remote_dir }}/fails_twice.count
user={{ ansible_facts.user_id }}
autostart=false
autorestart=false
startsecs=1
startretries=3

[group:pys]
programs=py1,py2

[unix_http_server]
file={{ supervisord_sock_path.path }}/supervisord.sock
{% if credentials.username is defined and credentials.username|default(false, boolean=true) %}
username = {{ credentials.username }}
password = {{ credentials.password }}
{% endif %}

[inet_http_server]
port=127.0.0.1:9001
{% if credentials.username is defined and credentials.username|default(false, boolean=true) %}
username = {{ credentials.username }}
password = {{ credentials.password }}
{% endif %}

[supervisorctl]
serverurl=unix://{{ supervisord_sock_path.path }}/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
