- name: validate that versions are properly sorted in a stable way
  ansible.builtin.assert:
    that:
      - "['a-1.9.rpm', 'a-1.10-1.rpm', 'a-1.09.rpm', 'b-1.01.rpm', 'a-2.1-0.rpm', 'a-1.10-0.rpm'] | community.general.version_sort == ['a-1.9.rpm', 'a-1.09.rpm', 'a-1.10-0.rpm', 'a-1.10-1.rpm', 'a-2.1-0.rpm', 'b-1.01.rpm']"

- name: validate that all styles sort the same stable-sort case
  ansible.builtin.assert:
    that:
      - "['a-1.9.rpm', 'a-1.10-1.rpm', 'a-1.09.rpm', 'b-1.01.rpm', 'a-2.1-0.rpm', 'a-1.10-0.rpm'] | community.general.version_sort(style=item) == ['a-1.9.rpm', 'a-1.09.rpm', 'a-1.10-0.rpm', 'a-1.10-1.rpm', 'a-2.1-0.rpm', 'b-1.01.rpm']"
  loop: [loose, natural, pre_release, post_release, numbers_first]

- name: validate that styles other than loose handle versions with differing numbers of components
  ansible.builtin.assert:
    that:
      - "['1.1.0-SNAPSHOT', '1.1-SNAPSHOT'] | community.general.version_sort(style=item.style) == item.expected"
      - "['1.1.0', '1.1'] | community.general.version_sort(style=item.style) == ['1.1', '1.1.0']"
  loop:
    - style: natural
      expected: ['1.1-SNAPSHOT', '1.1.0-SNAPSHOT']
    - style: pre_release
      expected: ['1.1-SNAPSHOT', '1.1.0-SNAPSHOT']
    - style: post_release
      expected: ['1.1-SNAPSHOT', '1.1.0-SNAPSHOT']
    - style: numbers_first
      expected: ['1.1.0-SNAPSHOT', '1.1-SNAPSHOT']

- name: validate how each style orders separators, text suffixes, and further numbers
  ansible.builtin.assert:
    that:
      - "['1.0rc1', '1.0.1', '1.0alpha', '1.0', '1.0-alpha'] | community.general.version_sort(style=item.style) == item.expected"
  loop:
    - style: natural
      expected: ['1.0', '1.0-alpha', '1.0.1', '1.0alpha', '1.0rc1']
    - style: pre_release
      expected: ['1.0alpha', '1.0-alpha', '1.0rc1', '1.0', '1.0.1']
    - style: post_release
      expected: ['1.0', '1.0alpha', '1.0-alpha', '1.0rc1', '1.0.1']
    - style: numbers_first
      expected: ['1.0', '1.0.1', '1.0alpha', '1.0-alpha', '1.0rc1']

- name: validate reverse sorting
  ansible.builtin.assert:
    that:
      - "['2.1', '2.10', '2.9'] | community.general.version_sort(style=item, reverse=true) == ['2.10', '2.9', '2.1']"
  loop: [loose, natural, pre_release, post_release, numbers_first]

- name: validate that a non-list iterable input is accepted
  ansible.builtin.assert:
    that:
      - "['2.1', '2.10', '2.9'] | map('trim') | community.general.version_sort == ['2.1', '2.9', '2.10']"

- name: sort with invalid arguments
  ansible.builtin.set_fact:
    invalid_result: "{{ item.input | community.general.version_sort(item.reverse | default(false), style=item.style | default('loose')) }}"
  loop:
    - input: '2.1'
      msg: Input must be a list of strings
    - input: ['2.1', 2]
      msg: Input elements must be strings
    - input: ['2.1']
      reverse: 'yes'
      msg: reverse must be a boolean
    - input: ['2.1']
      style: bogus
      msg: style must be one of
    - input: ['2.1']
      style: [natural]
      msg: style must be one of
  register: invalid_args
  ignore_errors: true

- name: validate that invalid arguments fail
  ansible.builtin.assert:
    that:
      - item is failed
      - item.item.msg in item.msg
  loop: "{{ invalid_args.results }}"
  loop_control:
    label: "{{ item.item.msg }}"
