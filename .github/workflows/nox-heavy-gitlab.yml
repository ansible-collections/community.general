# Integration tests for the targets with the `heavy/gitlab` alias.
# The GitLab container is started by setup_docker inside the ansible-test container, which must be privileged.
name: nox-heavy-gitlab
'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-test:
    uses: ansible-community/antsibull-nox/.github/workflows/reusable-nox-run.yml@main
    with:
      session-name: Heavy integration tests for GitLab
      sessions: ansible-test-integration-devel-ubuntu-heavy-gitlab
      extra-args: --docker-privileged
